<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FILM — MAIN MIND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#000;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:'Space Mono',monospace;overflow-x:hidden}
@media(hover:hover) and (pointer:fine){body,a,button{cursor:none}}
::selection{background:#6DCEF5;color:#000}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px)}
#ascii{position:fixed;inset:0;z-index:0;font-size:9px;line-height:1.45;color:rgba(109,206,245,.025);overflow:hidden;pointer-events:none;letter-spacing:.05em;padding:8px;white-space:pre-wrap;word-break:break-all}
#cur{position:fixed;pointer-events:none;z-index:9998;width:32px;height:18px;border:1px solid #6DCEF5;border-radius:50%;transform:translate(-50%,-50%) rotate(-30deg)}
#cur-dot{position:fixed;pointer-events:none;z-index:9999;width:3px;height:3px;background:#6DCEF5;border-radius:50%;transform:translate(-50%,-50%)}
@media(hover:none),(pointer:coarse){#cur,#cur-dot{display:none}}

/* TOPBAR */
#tb{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;border-bottom:1px solid #111;background:rgba(0,0,0,.92)}
@supports(padding:max(0px)){#tb{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}}
.tb-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.14em;color:#fff;text-decoration:none}
.tb-name span{color:#6DCEF5}
.tb-nav a{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.65);text-decoration:none;padding:8px 0;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.tb-nav a:hover,.tb-nav a:focus-visible,.tb-nav a.on{color:#6DCEF5;border-color:#6DCEF5;outline:none}
.tb-nav a+a{margin-left:20px}

/* HERO */
main{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding-top:52px;overflow:hidden}
#bg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center 20%;opacity:.9}
#bg.fade{animation:bgin .5s ease}
@keyframes bgin{from{opacity:0}to{opacity:.9}}
#bg::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.8) 32%,rgba(0,0,0,.15) 75%,rgba(0,0,0,.35) 100%)}
#bg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(0deg,#000 5%,transparent)}
.hero{flex:1;display:flex;align-items:center;gap:36px;padding:48px 32px 32px}
@supports(padding:max(0px)){.hero{padding-left:max(32px,env(safe-area-inset-left))}}
.dots{display:flex;flex-direction:column;align-items:center;gap:16px;flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);border:0;padding:0;position:relative;transition:background .15s}
.dot::after{content:'';position:absolute;inset:-10px}
.dot:hover,.dot:focus-visible{background:#6DCEF5;outline:none}
.dot.on{width:22px;height:22px;background:none;border:1.5px solid #6DCEF5;margin:-8px 0}
.dot.on::before{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#6DCEF5}
.info{max-width:560px}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(56px,8vw,112px);line-height:.95;letter-spacing:.05em;text-transform:uppercase;margin-bottom:22px;text-shadow:0 2px 24px rgba(0,0,0,.7)}
.desc{max-width:46ch;font-size:13px;line-height:1.9;color:rgba(255,255,255,.82);margin-bottom:30px}
.play{display:inline-flex;align-items:center;gap:22px;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:#fff;padding:8px 8px 8px 24px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s,border-color .15s}
.play i{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#6DCEF5;color:#000;font-style:normal;font-size:11px;padding-left:2px}
.play:hover,.play:focus-visible{background:rgba(109,206,245,.22);border-color:#6DCEF5;outline:none}

/* BAR FILM LAIN */
.bar{display:flex;gap:8px;list-style:none;overflow-x:auto;scrollbar-width:none;margin:0 32px 32px;padding:14px 18px;border-radius:14px;background:rgba(20,20,20,.7);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.bar::-webkit-scrollbar{display:none}
@supports(padding:max(0px)){.bar{margin-left:max(32px,env(safe-area-inset-left));margin-right:max(32px,env(safe-area-inset-right));margin-bottom:max(32px,env(safe-area-inset-bottom))}}
.bar li{flex:1 0 220px}
.item{display:flex;align-items:center;gap:14px;width:100%;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;color:inherit;font:inherit;text-align:left;transition:border-color .15s,background .15s}
.item:hover,.item:focus-visible{background:rgba(109,206,245,.08);outline:none}
.item.on{border-color:#6DCEF5}
.th{flex:none;width:44px;aspect-ratio:2/3;border:1px solid rgba(255,255,255,.25);background:#050505;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:30px;color:rgba(109,206,245,.6)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.tx{min-width:0}
.tx b{display:block;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:block;font-size:10px;color:rgba(255,255,255,.55);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;color:#6DCEF5}

@media(max-width:860px){
  #tb{padding:0 16px}
  .hero{padding:36px 20px 24px}
  .dots{display:none}
  #bg::before{background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.78) 60%,rgba(0,0,0,.4) 100%)}
  .bar{margin:0 16px 20px;padding:10px}
  .bar li{flex-basis:200px}
}
</style>
</head>
<body>
<div id="ascii"></div>
<div id="cur"></div>
<div id="cur-dot"></div>

<div id="tb">
  <a class="tb-name" href="index.html">MAIN<span>.</span>MIND</a>
  <nav class="tb-nav"><a href="index.html">HOME</a><a href="komik.html">KOMIK</a><a href="film.html" class="on" aria-current="page">FILM</a></nav>
</div>

<main>
  <div id="bg"></div>
  <section class="hero">
    <div class="dots" id="dots" role="tablist" aria-label="Pilih film"></div>
    <div class="info">
      <h1 id="f-title"></h1>
      <p class="desc" id="f-desc"></p>
      <a class="play" id="f-watch" href="#">Play video <i>&#9654;</i></a>
    </div>
  </section>
  <ul class="bar" id="bar" aria-label="Film lainnya"></ul>
</main>

<script>
/* ===== ISI DAFTAR FILM DI SINI =====
   poster   : gambar poster kecil di bar bawah (contoh 'posters/judul.jpg')
   backdrop : gambar lebar untuk latar (kosongkan = pakai poster)
                                                                  */
var FILMS=[
  {title:'Judul Film 1',desc:'Tulis sinopsis singkat film kamu di sini. Dua sampai tiga kalimat sudah cukup supaya penonton tahu ceritanya tentang apa.',genres:['Genre','Genre'],poster:'',backdrop:'',watchHref:'#'},
  {title:'Judul Film 2',desc:'Sinopsis film kedua.',genres:['Genre','Genre'],poster:'',backdrop:'',watchHref:'#'},
  {title:'Judul Film 3',desc:'Sinopsis film ketiga.',genres:['Genre'],poster:'',backdrop:'',watchHref:'#'}
];
/* =================================== */

function $(id){return document.getElementById(id)}
var dots=[],items=[];
function show(i){
  var f=FILMS[i];
  $('f-title').textContent=f.title;
  $('f-desc').textContent=f.desc;
  $('f-watch').href=f.watchHref;
  var bg=$('bg'),img=f.backdrop||f.poster;
  bg.style.backgroundImage=img?'url("'+img+'")':'none';
  bg.classList.remove('fade');void bg.offsetWidth;bg.classList.add('fade');
  document.title=f.title+' \u2014 MAIN MIND';
  dots.forEach(function(d,k){d.className='dot'+(k===i?' on':'');d.setAttribute('aria-selected',k===i?'true':'false');});
  items.forEach(function(c,k){c.className='item'+(k===i?' on':'');c.setAttribute('aria-current',k===i?'true':'false');});
}
FILMS.forEach(function(f,i){
  var d=document.createElement('button');d.type='button';d.setAttribute('role','tab');d.setAttribute('aria-label',f.title);
  d.addEventListener('click',function(){show(i);});$('dots').appendChild(d);dots.push(d);

  var li=document.createElement('li');
  var b=document.createElement('button');b.type='button';b.className='item';
  var th=document.createElement('span');th.className='th';
  if(f.poster){var im=document.createElement('img');im.src=f.poster;im.alt='Poster '+f.title;im.loading='lazy';th.appendChild(im);}
  else th.textContent='?';
  var tx=document.createElement('span');tx.className='tx';
  var t=document.createElement('b');t.textContent=f.title;
  var g=document.createElement('small');g.textContent=f.genres.join('/');
  var m=document.createElement('em');m.textContent='MORE \u25B8';
  tx.appendChild(t);tx.appendChild(g);tx.appendChild(m);
  b.appendChild(th);b.appendChild(tx);b.addEventListener('click',function(){show(i);});
  li.appendChild(b);$('bar').appendChild(li);items.push(b);
});
show(0);

var IS_TOUCH=!window.matchMedia('(hover:hover) and (pointer:fine)').matches;
var asciiEl=$('ascii'),words=['?','MAIN','MIND','1895','ANTI','VOID','CUT','REEL','RAW'];
function buildAscii(){
  var cols=Math.floor(innerWidth/7),rows=Math.floor(innerHeight/13),out='';
  for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){var n=Math.random();
    if(n>.994)out+=words[Math.floor(Math.random()*words.length)].charAt(0);
    else if(n>.988)out+=String(Math.floor(Math.random()*9));
    else if(n>.975)out+='.';else out+=' ';}out+='\n';}
  asciiEl.textContent=out;
}
buildAscii();setInterval(buildAscii,IS_TOUCH?3500:2000);addEventListener('resize',buildAscii);

if(!IS_TOUCH){
  var cur=$('cur'),dot=$('cur-dot'),cx=0,cy=0,rx=0,ry=0;
  document.addEventListener('mousemove',function(e){cx=e.clientX;cy=e.clientY;dot.style.left=cx+'px';dot.style.top=cy+'px';});
  (function anim(){rx+=(cx-rx)*.13;ry+=(cy-ry)*.13;cur.style.left=rx+'px';cur.style.top=ry+'px';requestAnimationFrame(anim);})();
}
</script>
</body>
</html>
